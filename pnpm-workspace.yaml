packages:
  - apps/*
  - packages/*

allowBuilds:
  "@apollo/protobufjs": true
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

blockExoticSubdeps: true

catalogs:
  default:
    "@types/node": ^26.6.6
    fast-xml-parser: ^5.11.2
    sharp: ^0.35.5
    tsdown: ^0.23.3
    typescript: ^6.0.3
    zod: ^4.6.7

injectWorkspacePackages: true

linkWorkspacePackages: true

minimumReleaseAge: 1440

# --experimental-transform-types
nodeOptions: ${NODE_OPTIONS:- }
  --no-warnings=ExperimentalWarning --use-system-ca

sharedWorkspaceLockfile: true

syncInjectedDepsAfterScripts:
  - build

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
  - prisma@7.10.1

pmOnFail: "ignore"

permissions:
  "@apollo/client":
    skills: true
  jotai-rolldown:
    build: true
  prisma-json-types-generator:
    skills: true
