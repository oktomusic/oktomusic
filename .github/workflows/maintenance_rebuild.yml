---
name: Maintenance Rebuild

on:
  schedule:
    - cron: "25 2 * * 6"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find latest stable tag
        id: latest
        shell: bash
        run: |
          TAG=$(git tag --sort=-version:refname \
            | awk '/^v?[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ -n "$TAG" ]]; then
            echo "Latest stable tag: $TAG"
          else
            echo "No stable tag found."
          fi

      - name: Rebuild master branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --ref "master"

      - name: Rebuild latest stable tag
        if: steps.latest.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_LATEST_OUTPUTS_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          gh workflow run ci.yml \
            --ref "${STEPS_LATEST_OUTPUTS_TAG}"
